<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explora productos tecnologicos y prepara tu pedido en TecnoStok.">
    <title>TecnoStok | Suministros Tecnologicos</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" aria-label="TecnoStok, inicio">
                <span class="brand-mark" aria-hidden="true">T</span>
                <span>TecnoStok</span>
            </a>
            <p class="header-tagline">Tecnologia para tu dia a dia</p>
            <a class="cart-shortcut" href="#carrito">
                Carrito <span id="headers-units" class="units-badge" aria-live="polite">0</span>
            </a>
        </div>
    </header>
    <main class="page-shell">
        <section class="intro" aria-labelledby="page-title">
            <div>
                <p class="eyebrow">Tienda de suministros tecnologicos</p>
                <h1 id="page-title">Encuentra lo que necesitas</h1>
                <p class="intro-copy">Explora el catalogo de productos, arma tu pedido y revisa el total antes de confirmar</p>
            </div>
            <div class="intro-note">
                <span class="note-icon" aria-hidden="true">!</span>
                <span>10% de descuento desde <strong>$300.000 COP</strong></span>
            </div>
        </section>

        <section class="catalog-section" aria-labelledby="catalog-title">
            <div class="section-heading">
                <div>
                <p class="eyebrow">Catalogo</p>
                <h2 id="catalogo-title">Productos</h2>
                </div>
                <p id="catalog-count" class="muted count-label" aria-live="polite"></p>
            </div>
           <form id="filters" class="filters" role="search">
            <div class="field search-field">
                <label for="search">Busqueda</label>
                <input id="search" name="search" type="search" placeholder="Nombre">
            </div>
            <div class="field">
                <label for="category">Categoria</label>
                <select id="category" name="category">
                    <option value="">Todas las categorias</option>
                </select>
            </div>
            <div class="field">
                <label for="sort">Ordenar por precio</label>
                <select id="sort" name="sort">
                    <option value="default">Orden original</option>
                    <option value="asc">Menor precio</option>
                    <option value="desc">Mayor precio</option>
                </select>
            </div>
            <label class="availability-filter">
                <input id="available-only" name="available" type="checkbox">
                <span>Solo disponibles</span>
            </label>
            <button id="clear-filters" class="button button-secondary clear-button" type="button">Limpiar filtros</button>
           </form>
        </section>
    </main>
</body>
</html>
